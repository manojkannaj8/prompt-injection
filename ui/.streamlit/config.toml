# The only Streamlit config of this project. Streamlit loads the config next to the main script (ui/app.py)
# last, so this file applies however the app is started: locally or on a host.
#
# Do NOT set server.address here. A host must be able to reach the server from outside its container;
# binding to localhost here makes a hosted app hang at start-up. Local runs are bound to localhost by
# run_dashboard.py instead (--server.address localhost).

[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#151a22"
textColor = "#e6ebf2"
font = "sans serif"

[client]
# Never show Python tracebacks or file paths in the browser. Details go to the terminal.
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
fileWatcherType = "none"

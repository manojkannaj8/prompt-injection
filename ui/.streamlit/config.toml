# The only Streamlit config of this project. Streamlit loads the config next to the main script (ui/app.py)
# last, so this file applies however the app is started: locally or on a host.
#
# Do NOT set [server] options here. They would also apply on a host, where they break things:
#   server.address = "localhost"       the host cannot reach the app, so it hangs at start-up
#   server.fileWatcherType = "none"    pushed code changes are not picked up until the app is rebooted
# Local runs get both from run_dashboard.py instead.

[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#151a22"
textColor = "#e6ebf2"
font = "sans serif"

[client]
# Never show Python tracebacks or file paths in the browser. Details go to the terminal.
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

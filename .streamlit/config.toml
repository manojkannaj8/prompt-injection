# Used when the app is started from the repository root (this is what Streamlit Community Cloud does:
# `streamlit run ui/app.py`). Local runs through run_dashboard.py use ui/.streamlit/config.toml, which
# also binds the server to localhost.

[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#151a22"
textColor = "#e6ebf2"
font = "sans serif"

[client]
# Never show Python tracebacks or file paths in the browser.
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
fileWatcherType = "none"
